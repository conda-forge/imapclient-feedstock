schema_version: 1

context:
  name: IMAPClient
  version: "4.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | lower }}-${{ version }}.tar.gz
  sha256: b7cefa7c9bf3ec029c007dfade191480b82eb3816fc20ab23ef48e7aec841a7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six

tests:
  - python:
      imports:
        - imapclient
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: BSD-3-Clause
  license_file: COPYING
  summary: Easy-to-use, Pythonic and complete IMAP client library
  homepage: http://imapclient.freshfoo.com/
  repository: https://github.com/mjs/imapclient
  documentation: http://imapclient.readthedocs.io/

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
